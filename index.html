<script>document.write('<script src="version.js?t=' + Date.now() + '"><\/script>');</script>
<script>
window.__v = function (f) { var V = window.__V || {}; return f + '?v=' + (V[f] || Date.now()); };
document.write('<link rel="stylesheet" href="' + __v('style.css') + '">');
</script>
</head>
<body>
<header id="top">
  <button id="back" class="icon-btn" aria-label="ย้อนกลับ" hidden>‹</button>
  <div class="title"><b id="title">รายงานผล ส.ทล.2</b><small id="subtitle"></small></div>
  <button id="home" class="icon-btn" aria-label="หน้าแรก" hidden>⌂</button>
</header>
<nav id="subnav" class="subnav" hidden></nav>
<main id="app"><div class="loading"><div class="spin" id="spin0"></div><p>กำลังเชื่อมต่อ…</p></div></main>
<script>(function(){var e=document.getElementById('spin0'),d=0;(function t(){if(!e||!e.isConnected)return;d=(d+12)%360;e.style.transform='rotate('+d+'deg)';setTimeout(t,40);})();})();</script>
<nav id="tabs" class="tabs" aria-label="เมนูหลัก" hidden></nav>

<div id="modal" hidden></div>

<script>document.write('<script src="' + __v('config.js') + '"><\/script><script src="' + __v('pr.js') + '"><\/script><script src="' + __v('charts.js') + '"><\/script><script src="' + __v('app.js') + '"><\/script>');</script>
<script>
// กันค้าง: ถ้า 35 วินาทียังไม่เข้าระบบ แสดงขั้นที่ค้างและปุ่มลองใหม่ (ทำงานแม้ app.js โหลดไม่สำเร็จ)
setTimeout(function () {
  if (window.__booted) return;
  var a = document.getElementById('app'); if (!a) return;
  a.innerHTML = '<div class="err">⚠️ ยังเชื่อมต่อไม่สำเร็จ' + (window.__stage ? ' (ค้างที่: ' + window.__stage + ')' : ' (โหลดหน้าเว็บไม่ครบ)') + ' — ตรวจสัญญาณแล้วกดลองใหม่</div>';
  var b = document.createElement('button'); b.className = 'btn block'; b.textContent = 'ลองใหม่'; b.onclick = function () { location.reload(); }; a.appendChild(b);
}, (window.APP_CONFIG && window.APP_CONFIG.WATCHDOG_MS) || 35000);
</script>
</body>
</html>
