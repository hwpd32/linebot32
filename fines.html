<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบทะเบียนค่าปรับ</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1d2433; --muted:#5b6475; --line:#dde2ea;
  --pri:#1f5fbf; --pri-ink:#fff; --pri-soft:#e8f0fc;
  --ok:#1e7a3c; --ok-soft:#e5f5ea; --bad:#b3261e; --bad-soft:#fdecea; --warn:#8a5a00; --warn-soft:#fff5d6;
  --radius:10px; --shadow:0 1px 2px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Leelawadee UI","TH Sarabun New","Sarabun","Noto Sans Thai","Tahoma",sans-serif;font-size:16px;line-height:1.55}
header{background:#14325f;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:600}
header .sub{opacity:.85;font-size:14px}
header .ver{margin-left:auto;font-size:13px;opacity:.7}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.banner{border-radius:var(--radius);padding:10px 14px;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f0d27a}
.banner.bad{background:var(--bad-soft);color:var(--bad);border:1px solid #f1b7b1}
.banner.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #a8d9b8}
.banner.info{background:var(--pri-soft);color:#12407f;border:1px solid #b9cff2}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card>.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card>.hd h2{font-size:17px;margin:0;font-weight:600}
.card>.hd .step{width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.card>.hd .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card>.bd{padding:14px 16px}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fbfcfe}
.stat .k{font-size:13px;color:var(--muted)} .stat .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;cursor:pointer}
button:hover{background:#f1f4f9}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:600}
button.pri:hover{filter:brightness(1.07)}
button.big{padding:11px 20px;font-size:17px}
button.danger{color:var(--bad);border-color:#efb3ad}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid #c9d0dc;border-radius:7px;padding:7px 9px;background:#fff;color:var(--ink)}
input[type=number]{width:120px;text-align:right}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f3f6fb;font-weight:600;font-size:14px;color:#33415c}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--pri-soft);color:#12407f}
.drop{border:2px dashed #9fb3d6;border-radius:12px;padding:26px;text-align:center;background:#f8fbff;color:#33415c;transition:.15s}
.drop.over{background:#e6effd;border-color:var(--pri)}
.drop b{color:var(--pri)}
.q{border:1px solid #f0d27a;background:#fffaf0;border-radius:8px;padding:10px 12px;margin:8px 0}
.q .t{font-weight:600;margin-bottom:6px}
.notes{white-space:pre-wrap;font-size:14px;background:#f8f9fb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0}
.hidden{display:none!important}
dialog{border:none;border-radius:12px;padding:0;max-width:760px;width:94vw;box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,25,45,.45)}
dialog .hd{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:17px}
dialog .bd{padding:14px 18px;max-height:70vh;overflow:auto}
dialog .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:8px 12px;align-items:center}
.form input{width:100%}
.form .sec{grid-column:1/-1;font-weight:600;margin-top:8px;color:#12407f}
.days{display:flex;flex-wrap:wrap;gap:4px}
.days span{font-size:12px;border-radius:5px;padding:2px 6px;background:#eef1f6;color:#556}
.days span.done{background:var(--ok-soft);color:var(--ok)} .days span.man{background:var(--warn-soft);color:var(--warn)}
.days span.next{background:var(--pri);color:#fff}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #c7d3ea;border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2433;color:#fff;border-radius:8px;padding:10px 16px;box-shadow:var(--shadow);max-width:90vw;z-index:50}
@media (max-width:640px){ .form{grid-template-columns:1fr} header .ver{margin-left:0} }
/* แถบเชื่อมต่อระบบรายงานผล (bridge.js) */
#bridge{max-width:1180px;margin:14px auto 0;padding:0 16px}
#bridge:empty{display:none}
.sync{border-radius:var(--radius);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.sync .dot{width:11px;height:11px;border-radius:50%;flex:none;background:#9aa3b2}
.sync.ok .dot{background:#1e9b4f} .sync.warn{background:var(--warn-soft);border-color:#f0d27a} .sync.warn .dot{background:#d99a00}
.sync.bad{background:var(--bad-soft);border-color:#f1b7b1} .sync.bad .dot{background:var(--bad)}
.sync .grow{flex:1;min-width:220px} .sync small{display:block;color:var(--muted);font-size:13px}
header a.back{color:#fff;opacity:.85;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:4px 10px}
</style>
</head>

<script>/* bridge.js — ส่งสรุปที่ไม่ระบุตัวผู้ชำระเข้า "ระบบรายงานผล" (LINE) อัตโนมัติหลังบันทึกวันลงทะเบียน

(function (root) {

    async get(k) { try { const db = await this.db(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } },

  };

  // ---------------- สร้างข้อมูลที่จะส่ง (คัดเฉพาะช่องที่อนุญาต) ----------------

  // วันที่บันทึกไว้ก่อนแล้ว (ส่งย้อนหลัง): อ่านจากชีตกระทบยอดในไฟล์ทะเบียน

    return { mode: L.get(SH.REC, 'D' + r) === 'กรอกมือ' ? 'manual' : 'auto', ptm: r2(g('E')), ktb: r2(g('F')), booked: r2(O), offbook: r2(g('P')), other: r2(g('Q')), confirmed: r2(g('T')),

  }

  // ---------------- เชื่อมต่อ ----------------

<script>/* app.js — หน้าจอระบบทะเบียนค่าปรับ (ประมวลผลไฟล์ในเครื่อง; ส่งเข้าระบบรายงานผลเฉพาะสรุปยอดและข้อมูลใบสั่ง ผ่าน bridge.js — ไม่มีชื่อ/เลขบัตรผู้ชำระ) */

  function seedPending() {
    const d = S.setupDraft; const dates = [...new Set([...Object.keys(S.ktb), ...Object.keys(S.ptm)])].filter(x => x < d.start).sort();
    let pending = []; const log = [];
    if (!dates.length) return { pending, log };
    let D = dates[0]; const last = Store.addDays(d.start, -1);
    while (D <= last) {
      if (S.ktb[D] && S.ptm[D]) {
        const ans = {};
        let res = Recon.reconcileDay({ date: D, ktb: S.ktb[D], ptm: S.ptm[D], pending });
        for (const q of res.questions) ans[q.id] = q.type === 'unmatched' ? { notFine: true } : q.type === 'choose' ? { pick: 0 } : { override: true, reason: 'โหมดเริ่มต้น' };
        res = Recon.reconcileDay({ date: D, ktb: S.ktb[D], ptm: S.ptm[D], pending, answers: ans });
        pending = res.pendingAfter; log.push(`${thS(D)}: ค้างรับ ${pending.length} รายการ`);
      } else if (S.ktb[D]) { log.push(`${thS(D)}: ไม่มีไฟล์ PTM — รายการค้างของวันนี้จะไม่ถูกนับ`); const res = Recon.reconcileDay({ date: D, ktb: S.ktb[D], pending, manual: {}, answers: new Proxy({}, { get: () => ({ notFine: true }) }) }); pending = res.pendingAfter; }
      else log.push(`${thS(D)}: ไม่มีไฟล์ KTB — ข้าม`);
      D = Store.addDays(D, 1);
    }
    return { pending, log };
  }

    const others = ktb.lines.filter(l => ['BA', 'CROSS', 'DEPOSIT', 'UNKNOWN'].includes(l.type));
    const ptmD = S.ptm[D];
    let cur = S.manual[D];
    if (!cur && ptmD) {  // มีไฟล์ PTM (แต่ไม่ตรงกับ KTB): ตั้งค่าเริ่มต้นจากช่องทาง KTB/FASTPAY ในไฟล์ PTM ให้แก้เฉพาะส่วนต่าง
      cur = {}; for (const i of ptmD.items.filter(i => i.group === 'KTB' || i.group === 'FASTPAY')) { const c = cur[i.act] = cur[i.act] || { amount: 0, count: 0 }; c.amount = r2(c.amount + i.amount); c.count++; }
    }
    cur = cur || {};
    const ptmOwn = ptmD ? r2(ptmD.items.filter(i => i.group === 'KTB' || i.group === 'FASTPAY').reduce((x, i) => x + i.amount, 0)) : 0;
    let h = ptmD
      ? `<div class="banner warn">ใช้เมื่อไฟล์ PTM ไม่ตรงกับ KTB แม้ดาวน์โหลดใหม่แล้ว — ช่องด้านล่างใส่ตัวเลขจากไฟล์ PTM ไว้ให้ (รวม ${fmt(ptmOwn)} บาท) ให้แก้เฉพาะส่วนต่างให้ตรงกับเงินที่เข้าจริง รายการไปรษณีย์/ต่างสถานี/ชำระที่สถานีในไฟล์ PTM ยังเก็บเป็นค้างรับตามปกติ วันนี้จะมีป้าย "กรอกมือ" ในชีตกระทบยอด</div>`
      : `<div class="banner warn">ใช้เมื่อดาวน์โหลดไฟล์ PTM ของวันนี้ไม่ได้ วันนี้จะมีป้าย "กรอกมือ" ในชีตกระทบยอด</div>`;
    h += `
      <p>วันที่ <b>${esc(thL(D))}</b> — เงินเข้าแบบ Auto Transfer + Payment gateway รวม <b>${fmt(own)}</b> บาท ให้แยกยอดนี้ตาม พ.ร.บ. (ดูจากใบเสร็จ/รายงานอื่น)</p>
      ${others.length ? `<p class="small muted">เงินเข้าอื่นของวันนี้ (${others.map(l => fmt(l.amount)).join(', ')} บาท) ระบบจะจับคู่กับค้างรับหรือถามแยกให้เอง ไม่ต้องรวมในช่องด้านล่าง</p>` : ''}
      <table><tr><th>พ.ร.บ.</th><th class="num">ยอดเงิน (บาท)</th><th class="num">จำนวนราย</th></tr>`;
    for (const a of ACTS) h += `<tr><td>${esc(a)}</td><td class="num"><input type="number" step="0.01" id="man_a_${Recon.ACTS[a]}" value="${cur[a] ? cur[a].amount : ''}"></td><td class="num"><input type="number" step="1" id="man_c_${Recon.ACTS[a]}" value="${cur[a] ? cur[a].count : ''}"></td></tr>`;
    h += `<tr><th>รวม</th><th class="num" id="manSum">0.00</th><th></th></tr></table>
      <p><label><input type="checkbox" id="manTried"> ได้ลองดาวน์โหลดไฟล์ PTM ใหม่แล้ว แต่ใช้ไม่ได้</label></p>`;
    const read = () => { const m = {}; for (const a of ACTS) { const k = Recon.ACTS[a]; m[a] = { amount: Number($('#man_a_' + k).value) || 0, count: Number($('#man_c_' + k).value) || 0 }; } return m; };
    const ok = await dialog(ptmD ? 'กรอกยอดเอง (ไฟล์ PTM ไม่ตรงกับ KTB)' : 'ไม่มีไฟล์ PTM – กรอกเอง', h, [{ label: 'ยกเลิก', value: false }, { label: 'ใช้ยอดนี้', value: true, cls: 'pri', validate: () => {
      const m = read(); const sum = r2(Object.values(m).reduce((x, v) => x + v.amount, 0));
      if (!$('#manTried').checked) { alert('กรุณาลองดาวน์โหลดไฟล์ PTM ใหม่ก่อน แล้วติ๊กยืนยัน'); return false; }
      if (Math.abs(sum - own) > 0.001) { alert(`ยอดรวมที่กรอก (${fmt(sum)}) ต้องเท่ากับ ${fmt(own)} บาท`); return false; }
      for (const [a, v] of Object.entries(m)) if (v.amount > 0 && v.count <= 0) { alert('กรุณาระบุจำนวนรายของ ' + a); return false; }
      manualEntry._v = m; return true;
    } }], bd => { bd.oninput = () => { const m = read(); $('#manSum').textContent = fmt(Object.values(m).reduce((x, v) => x + v.amount, 0)); }; bd.oninput(); });
    if (!ok) return;
    S.manual[D] = manualEntry._v; S.answers[D] = {}; render();
  }

  // ---------------- นอกทะเบียน / ค้างรับ ----------------
  async function showOffbook() {
    const list = S.st.offbook;
    let h = list.length ? '<table><tr><th>วันที่</th><th>เลขใบสั่ง</th><th>พ.ร.บ.</th><th class="num">ยอด</th><th>สถานะ</th><th>วิธีจัดการ</th></tr>' : '<p class="muted">ยังไม่มีรายการนอกทะเบียน</p>';
    list.forEach((o, i) => {
      h += `<tr><td>${esc(o.docDate)}</td><td>${esc(o.ticket)}</td><td>${esc(o.act)}</td><td class="num">${fmt(o.amount)}</td><td>${o.status === 'จัดการแล้ว' ? '<span class="pill ok">จัดการแล้ว</span>' : '<span class="pill warn">ค้างจัดการ</span>'}</td>
        <td>${o.status === 'จัดการแล้ว' ? esc(o.how || '') : `<input id="off_${i}" placeholder="เช่น นำส่งแยกตามระเบียบ…" style="width:100%">`}</td></tr>`;
    });
    if (list.length) h += '</table><p class="small muted">พิมพ์วิธีจัดการในรายการที่จัดการแล้ว แล้วกด "บันทึก"</p>';
    const ok = await dialog('รายการนอกทะเบียน', h, [{ label: 'ปิด', value: false }].concat(list.some(o => o.status !== 'จัดการแล้ว') ? [{ label: 'บันทึก', value: true, cls: 'pri' }] : []));
    if (!ok) return;
    const upd = []; list.forEach((o, i) => { const el = document.getElementById('off_' + i); if (el && el.value.trim()) upd.push([o.row, el.value.trim()]); });
    if (!upd.length) return;
    await withBusy('กำลังบันทึก…', async () => { await refreshIfChanged(); for (const [row, how] of upd) Store.resolveOffbook(S.L, row, how); await persist(); });
  }
  function showPending() {
    const p = S.st.pending;
    let h = p.length ? `<table><tr><th>วันที่ใบสั่ง</th><th>ช่องทาง</th><th>พ.ร.บ.</th><th>เลขใบสั่ง</th><th class="num">ยอด</th></tr>${p.map(i => `<tr><td>${esc(thS(i.docDate))}</td><td>${esc(Recon.groupTh(i))}</td><td>${esc(i.act)}</td><td>${esc(i.ticket)}</td><td class="num">${fmt(i.amount)}</td></tr>`).join('')}</table>` : '<p class="muted">ไม่มีรายการค้างรับ</p>';
    dialog('รายการค้างรับ (รอเงินเข้าบัญชี)', h, [{ label: 'ปิด', value: false }]);

  // ---------------- แสดงผล ----------------
  function render() {
    const m = $('#main'); $('#hdrVer').textContent = 'เวอร์ชัน ' + APPV;
    if (S.st) $('#hdrStation').textContent = S.st.settings.station_short + ' — รอบ ' + thL(S.st.start) + ' ถึง ' + thL(S.st.end);
    let h = '';
    if (S.msg) h += `<div class="banner ${S.msg.cls}">${S.msg.html}</div>`;
    if (!S.dir && S.fs) h += folderCard();
    else if (!S.fs && !S.L && !S.setupDraft) h += fallbackCard();
    else if (!S.L && S.setupDraft) h += setupSeedCard();
    else if (!S.L) h += noLedgerCard();
    else h += statusCard() + filesCard() + dayCard();
    m.innerHTML = h; bind();
    bridge('render', S);
  }
  function folderCard() {
    return `<div class="card"><div class="hd"><div class="step">1</div><h2>เลือกโฟลเดอร์เก็บไฟล์ทะเบียน</h2></div><div class="bd">
      <p>เลือกโฟลเดอร์ที่ใช้เก็บไฟล์ทะเบียนค่าปรับ (เช่น "ทะเบียนค่าปรับ") ระบบจะอ่านและบันทึกไฟล์ในโฟลเดอร์นี้ และสำรองไฟล์ทุกครั้งไว้ในโฟลเดอร์ย่อย <b>สำรอง</b></p>
      <div class="row"><button class="pri big" id="btnPick">เลือกโฟลเดอร์ทะเบียน</button><button id="btnReopen" class="hidden">เปิดโฟลเดอร์เดิม</button></div>
      <p class="muted small">ไฟล์ทั้งหมดประมวลผลในเครื่องนี้ — ระบบรายงานผลได้รับเฉพาะสรุปยอดรายวันและข้อมูลใบสั่งที่ชำระแล้ว (ไม่มีชื่อ/เลขบัตรผู้ชำระ)</p></div></div>`;

      <div class="banner warn">แนะนำให้เปิดไฟล์ระบบนี้ด้วย Google Chrome หรือ Microsoft Edge รุ่นใหม่ เพื่อให้บันทึกทับไฟล์ทะเบียนได้เอง</div>
      <p>ในโหมดนี้ ให้เลือกไฟล์ทะเบียนของรอบปัจจุบัน ระบบจะดาวน์โหลดไฟล์ฉบับใหม่หลังบันทึก แล้วให้นำไปแทนที่ไฟล์เดิมเอง</p>

  function noLedgerCard() {
    return `<div class="card"><div class="hd"><h2>ยังไม่มีไฟล์ทะเบียนในโฟลเดอร์ "${esc(S.dirName)}"</h2></div><div class="bd">
      <p>ถ้าเป็นการใช้งานครั้งแรก ให้กด "เริ่มต้นใช้งาน" เพื่อตั้งค่าสถานีและเปิดรอบบัญชีแรก</p>
      <div class="row"><button class="pri big" id="btnSetup">เริ่มต้นใช้งาน</button><button id="btnPick2">เลือกโฟลเดอร์อื่น</button></div></div></div>`;
  }
  function setupSeedCard() {
    const d = S.setupDraft; const { pending, log } = seedPending();
    return `<div class="card"><div class="hd"><div class="step">3</div><h2>เริ่มต้นใช้งาน (3/3): รายการค้างรับยกมา</h2></div><div class="bd">
      <p>รอบแรกเริ่มวันที่ <b>${esc(thL(d.start))}</b> — ถ้ามีไฟล์ PTM และ KTB ของ <b>วันก่อนเริ่มรอบ</b> (แนะนำ 14 วันขึ้นไป) ให้ลากมาวางด้านล่าง ระบบจะหาว่ามีเงินไปรษณีย์/ต่างสถานีรายการใดที่ยังไม่เข้าบัญชี เพื่อยกมาเป็นค้างรับ <b>(ไม่ลงทะเบียนย้อนหลัง)</b></p>
      <div class="drop" id="drop">ลากไฟล์ PTM / KTB มาวางที่นี่ หรือ <b>คลิกเพื่อเลือกไฟล์</b><input type="file" id="fileIn" multiple accept=".xls,.xlsx" class="hidden"></div>
      ${log.length ? `<details class="small" style="margin-top:8px"><summary>ผลการอ่านไฟล์ย้อนหลัง</summary><pre class="notes">${esc(log.join('\n'))}</pre></details>` : ''}
      ${rejectedHtml()}
      <h3 style="font-size:16px">ค้างรับที่จะยกมา (${pending.length} รายการ ${fmt(pending.reduce((x, p) => x + p.amount, 0))} บาท)</h3>
      ${pending.length ? `<table><tr><th></th><th>วันที่ใบสั่ง</th><th>ช่องทาง</th><th>พ.ร.บ.</th><th>เลขใบสั่ง</th><th class="num">ยอด</th></tr>${pending.map((p, i) => `<tr><td><input type="checkbox" id="seed_${i}" checked></td><td>${esc(thS(p.docDate))}</td><td>${esc(Recon.groupTh(p))}</td><td>${esc(p.act)}</td><td>${esc(p.ticket)}</td><td class="num">${fmt(p.amount)}</td></tr>`).join('')}</table><p class="small muted">เอาเครื่องหมายออกได้ ถ้าทราบว่ารายการนั้นเข้าบัญชีแล้ว</p>` : '<p class="muted">ไม่มี (ถ้าไม่ใส่ไฟล์ย้อนหลัง เงินที่เข้ามาโดยไม่มีค้างรับ ระบบจะถามเจ้าหน้าที่ทีละรายการ)</p>'}
      <div class="row" style="margin-top:12px"><button class="pri big" id="btnFinishSetup">สร้างไฟล์ทะเบียนรอบแรก</button><button id="btnCancelSetup">ยกเลิก</button></div></div></div>`;
  }
  function statusCard() {
    const st = S.st; const n = Store.isoToSerial(st.end) - Store.isoToSerial(st.start) + 1;
    const pendSum = st.pending.reduce((x, p) => x + p.amount, 0);
    const offOpen = st.offbook.filter(o => o.status !== 'จัดการแล้ว');
    let days = '';
    for (let k = 0; k < n; k++) {
      const D = Store.addDays(st.start, k); const d = st.days[k];
      const cls = d ? (d.mode === 'กรอกมือ' ? 'man' : 'done') : (D === st.nextDate ? 'next' : '');
      days += `<span class="${cls}" title="${esc(thL(D))}${d ? ' — ' + esc(d.mode) : ''}">${Number(D.slice(8))}</span>`;
    }
    let h = '';
    if (S.upgradeWarn) h += `<div class="banner warn">${esc(S.upgradeWarn)}</div>`;
    if (offOpen.length) h += `<div class="banner warn">📌 มีรายการนอกทะเบียนค้างจัดการ <b>${offOpen.length}</b> รายการ (${fmt(offOpen.reduce((x, o) => x + Number(o.amount), 0))} บาท) — ยอดนี้เข้าบัญชีแล้วแต่ไม่ได้ลงทะเบียน <button id="btnOff2">ดู/จัดการ</button></div>`;
    h += `<div class="card"><div class="hd"><h2>รอบ ${esc(thL(st.start))} – ${esc(thL(st.end))}</h2>
      <div class="right"><button id="btnPending">ค้างรับ</button><button id="btnOff">นอกทะเบียน</button><button id="btnSettings">ตั้งค่าสถานี</button><button id="btnUndo" class="danger" ${st.lastIndex ? '' : 'disabled'}>ยกเลิกวันล่าสุด</button><button id="btnPick3">เปลี่ยนโฟลเดอร์</button></div></div>
      <div class="bd"><div class="grid">
        <div class="stat"><div class="k">ไฟล์ทะเบียน</div><div class="v" style="font-size:14px;overflow-wrap:anywhere">${esc(S.ledgerName)}</div></div>
        <div class="stat"><div class="k">บันทึกแล้ว</div><div class="v">${st.lastIndex} / ${n} วัน</div></div>
        <div class="stat"><div class="k">วันถัดไปที่ต้องทำ</div><div class="v">${st.closed ? 'ครบรอบแล้ว' : esc(thL(st.nextDate))}</div></div>
        <div class="stat"><div class="k">ค้างรับสะสม</div><div class="v">${fmt(pendSum)} <span class="small muted">(${st.pending.length} รายการ)</span></div></div>
      </div><div class="days" style="margin-top:10px">${days}<button id="btnEndDate" class="small" style="padding:0 8px;font-size:12px">แก้วันสิ้นสุดรอบ</button></div>
      ${st.closed ? `<div class="banner ok" style="margin-top:12px">รอบนี้บันทึกครบแล้ว <button class="pri" id="btnNewCycle">เปิดรอบใหม่</button></div>` : `<p class="small muted" style="margin:10px 0 0">หลังบันทึก: หน้า "คงเหลือประจำวัน" ของวันล่าสุดถูกตั้งเป็นพื้นที่พิมพ์ — เปิดไฟล์ใน Excel ไปที่ชีตนั้นแล้วกด Ctrl+P ได้ทันที</p>`}
      </div></div>`;
    return h;
  }
  function rejectedHtml() {
    if (!S.rejected.length) return '';
    return `<div class="banner bad" style="margin-top:10px;display:block"><b>ไฟล์ที่ใช้ไม่ได้ (${S.rejected.length})</b> <button id="btnClearRej" class="small">ล้างรายการ</button><ul style="margin:6px 0 0 18px;padding:0">${S.rejected.map(r => `<li><b>${esc(r.name)}</b> — ${esc(r.msg)}</li>`).join('')}</ul></div>`;
  }
  function filesCard() {
    const st = S.st;
    const dates = [...new Set([...Object.keys(S.ktb), ...Object.keys(S.ptm)])].sort();
    const upcoming = dates.filter(D => D >= st.nextDate || D > st.end);
    const done = dates.filter(D => !(D >= st.nextDate || D > st.end));
    let rows = '';
    for (const D of upcoming) {
      const k = S.ktb[D], p = S.ptm[D];
      const conf = S.conflicts['ktb' + D] || S.conflicts['ptm' + D];
      rows += `<tr><td>${esc(thL(D))}${D > st.end ? ' <span class="pill info">รอบถัดไป</span>' : ''}</td>
        <td>${k ? `<span class="pill ok">✓</span> ${fmt(k.totalCr)} บาท <span class="muted small">(${k.lines.length} รายการ)</span>` : '<span class="pill warn">ยังไม่มี</span>'}</td>
        <td>${p ? `<span class="pill ok">✓</span> ${fmt(p.total)} บาท <span class="muted small">(${p.items.length} ใบสั่ง)</span>` : (S.manual[D] ? '<span class="pill warn">กรอกมือ</span>' : '<span class="pill warn">ยังไม่มี</span>')}</td>
        <td>${conf ? '<span class="pill bad">มี 2 ไฟล์ยอดไม่ตรงกัน</span>' : ''}</td></tr>`;
    }
    return `<div class="card"><div class="hd"><div class="step">1</div><h2>ใส่ไฟล์ KTB และ PTM</h2>${upcoming.length ? '<div class="right"><button id="btnClearFiles">ล้างไฟล์ที่ใส่ไว้</button></div>' : ''}</div><div class="bd">
      <div class="drop" id="drop">ลากไฟล์ <b>KTB</b> และ <b>PTM</b> มาวางที่นี่ (ใส่หลายวันพร้อมกันได้ ไม่ต้องสนใจชื่อไฟล์) หรือ <b>คลิกเพื่อเลือกไฟล์</b>
      <input type="file" id="fileIn" multiple accept=".xls,.xlsx" class="hidden"></div>
      ${rejectedHtml()}
      ${upcoming.length ? (upcoming.length > 7 ? `<details style="margin-top:10px"><summary>ไฟล์ที่ใส่ไว้ ${upcoming.length} วัน (${esc(thS(upcoming[0]))} – ${esc(thS(upcoming[upcoming.length - 1]))}) — คลิกเพื่อดูรายวัน</summary>` : '<div>') + `<table style="margin-top:10px"><tr><th>วันที่</th><th>KTB</th><th>PTM</th><th></th></tr>${rows}</table>` + (upcoming.length > 7 ? '</details>' : '</div>') : ''}
      ${done.length ? `<p class="small muted">มีไฟล์ของวันที่บันทึกแล้ว ${done.length} วัน (ไม่ใช้ซ้ำ)</p>` : ''}
      </div></div>`;
  }
  function dayCard() {
    const st = S.st;
    if (st.closed) return '';
    const D = st.nextDate; const hd = `<div class="card"><div class="hd"><div class="step">2</div><h2>ตรวจและบันทึก: วันที่ ${esc(thL(D))}</h2></div><div class="bd">`;
    const conf = S.conflicts['ktb' + D] || S.conflicts['ptm' + D];
    if (conf) return hd + `<div class="banner bad">มีไฟล์ของวันนี้ 2 ไฟล์ที่ข้อมูลไม่ตรงกัน (${esc(conf[0].fileName)} กับ ${esc(conf[1].fileName)}) — กดล้างไฟล์ แล้วใส่เฉพาะไฟล์ที่ถูกต้อง</div></div></div>`;
    if (!S.ktb[D]) return hd + `<p>ยังไม่มีไฟล์ <b>KTB</b> ของวันที่ ${esc(thL(D))} — ดาวน์โหลดจาก KTB แล้วลากมาวางด้านบน</p>${!S.ptm[D] ? `<p>และยังไม่มีไฟล์ <b>PTM</b> ของวันนี้</p>` : ''}</div></div>`;
    if (!S.ptm[D] && !S.manual[D]) return hd + `<p>ยังไม่มีไฟล์ <b>PTM</b> ของวันที่ ${esc(thL(D))} — ดาวน์โหลดจาก PTM แล้วลากมาวางด้านบน</p>
      <p class="small muted">ถ้าดาวน์โหลดแล้วได้ข้อความ "หมดเวลาเข้าระบบ" ให้ออกจากระบบ PTM แล้วเข้าใหม่ก่อนดาวน์โหลด ถ้าลองแล้วยังไม่ได้จริง ๆ (เช่น ไฟล์เก่าเกินจนระบบไม่ให้โหลด) ใช้ปุ่มด้านล่าง</p>
      <button id="btnManual">ไม่มีไฟล์ PTM – กรอกเอง</button></div></div>`;
    const res = compute(D);
    const chain = readyChain();
    let h = hd;
    if (S.manual[D]) h += `<div class="banner warn">วันนี้ใช้ยอดที่กรอกเอง${S.ptm[D] ? ' (ช่องทาง KTB/FASTPAY)' : ' (ไม่มีไฟล์ PTM)'} <button id="btnManual">แก้ยอด</button> <button id="btnManualCancel">ยกเลิกกรอกมือ</button></div>`;
    const pill = v => v === '✓' ? '<span class="pill ok">✓ ผ่าน</span>' : v === '-' ? '<span class="pill warn">– (กรอกมือ)</span>' : '<span class="pill bad">✗ ไม่ผ่าน</span>';
    h += `<div class="grid">
      <div class="stat"><div class="k">ยอด PTM ของวันนี้</div><div class="v">${fmt(res.E)}</div></div>
      <div class="stat"><div class="k">เงินเข้า KTB</div><div class="v">${fmt(res.F)}</div></div>
      <div class="stat"><div class="k">ลงทะเบียนวันนี้</div><div class="v">${fmt(res.O)}</div></div>
      <div class="stat"><div class="k">ค้างรับสะสมหลังบันทึก</div><div class="v">${fmt(res.U)}</div></div></div>
      <div class="row" style="margin:10px 0">ตรวจ 1 ช่องทาง ${res.questions.some(q => q.type === 'check1') ? '<span class="pill bad">✗ ไม่ผ่าน</span>' : pill(res.V)} &nbsp; ตรวจ 2 ยอดวัน ${res.questions.length ? '<span class="pill warn">รอตอบคำถาม</span>' : pill(res.check2)} &nbsp; ตรวจ 3 ค้างรับ ${res.questions.length ? '<span class="pill warn">รอตอบคำถาม</span>' : pill(res.check3)}</div>
      <table><tr><th>พ.ร.บ.</th><th class="num">ยอดเงิน (บาท)</th><th class="num">จำนวนราย</th></tr>
      ${ACTS.map(a => `<tr><td>${esc(a)}</td><td class="num">${fmt(res.ledger[a].amount)}</td><td class="num">${fmt0(res.ledger[a].count)}</td></tr>`).join('')}
      ${res.P ? `<tr><td>นอกทะเบียน <span class="pill warn">ไม่มีช่องในทะเบียน</span></td><td class="num">${fmt(res.P)}</td><td></td></tr>` : ''}
      ${res.Q ? `<tr><td>เงินเข้าอื่น (ไม่ใช่ค่าปรับ)</td><td class="num">${fmt(res.Q)}</td><td></td></tr>` : ''}
      <tr><th>รวมลงบัญชี</th><th class="num">${fmt(res.O + res.P + res.Q)}</th><th></th></tr></table>`;
    if (res.errors.length) h += res.errors.map(e => `<div class="banner bad" style="margin-top:10px">⚠️ ${esc(e.msg)}</div>`).join('');
    if (res.questions.length) h += `<h3 style="font-size:16px;margin:14px 0 4px">ต้องให้เจ้าหน้าที่ตัดสินใจ (${res.questions.length})</h3>` + res.questions.map(q => questionHtml(D, q)).join('');
    h += `<h3 style="font-size:16px;margin:14px 0 4px">หมายเหตุที่จะบันทึก</h3><pre class="notes">${esc(res.notes.join('\n') || '-')}</pre>`;
    h += `<div class="row" style="margin-top:14px"><button class="pri big" id="btnSave" ${res.ready && res.check3 === '✓' ? '' : 'disabled'}>บันทึกวันที่ ${esc(thS(D))} ลงทะเบียน</button>
      ${chain.length > 1 ? `<button class="big" id="btnSaveAll">บันทึกทุกวันที่พร้อม (${chain.length} วัน)</button>` : ''}</div>`;
    return h + '</div></div>';
  }
  function questionHtml(D, q) {
    const id = q.id;
    if (q.type === 'check1') return `<div class="q"><div class="t">${esc(q.text)}</div>
      <p class="small">ให้ดาวน์โหลดไฟล์ PTM และ KTB ของวันนี้ใหม่แล้วลากมาวางอีกครั้ง ถ้ายังไม่ตรงกัน ให้ใช้วิธีกรอกยอดเองสำหรับวันนี้ (ยึดเงินที่เข้า KTB จริง)</p>
      <button id="btnManualQ">กรอกยอดเองสำหรับวันนี้</button></div>`;
    if (q.type === 'choose') return `<div class="q"><div class="t">${esc(q.text)}</div>${q.options.map(o => `<label style="display:block"><input type="radio" name="qc_${id}" value="${o.value}" ${o.value === q.default ? 'checked' : ''}> ${esc(o.label)}</label>`).join('')}
      <button data-q="${id}" data-t="choose">ยืนยัน</button></div>`;
    const d = q.default;
    return `<div class="q"><div class="t">${esc(q.text)}</div><div class="row">
      <select id="qa_${id}">${ACTS.map(a => `<option ${a === d.act ? 'selected' : ''}>${esc(a)}</option>`).join('')}<option value="__NF">ไม่ใช่เงินค่าปรับ (ไม่ลงบัญชี)</option></select>
      <label>จำนวนราย <input type="number" id="qn_${id}" value="${d.count}" min="0" step="1" style="width:80px"></label>
      <input id="qt_${id}" placeholder="หมายเหตุ (ถ้ามี)" style="flex:1;min-width:160px">
      <button data-q="${id}" data-t="unmatched">ยืนยัน</button></div></div>`;
  }
  function answer(D, id, t) {
    const a = S.answers[D] = S.answers[D] || {};
    if (t === 'check1') { const r = $('#qr_' + id).value.trim(); if (!r) { alert('กรุณาระบุเหตุผล'); return; } a[id] = { override: true, reason: r }; }
    else if (t === 'choose') { const el = document.querySelector(`input[name="qc_${id}"]:checked`); a[id] = { pick: Number(el.value) }; }
    else { const act = $('#qa_' + id).value; const note = $('#qt_' + id).value.trim(); if (act === '__NF') a[id] = { notFine: true }; else { const n = Number($('#qn_' + id).value); if (!(n >= 1)) { alert('จำนวนรายต้องอย่างน้อย 1'); return; } a[id] = { act, count: n, note }; } }
    render();
  }
  function bind() {
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on('btnPick', () => withBusy('กำลังเปิดโฟลเดอร์…', pickFolder));
    on('btnPick2', () => withBusy('กำลังเปิดโฟลเดอร์…', pickFolder));
    on('btnPick3', () => withBusy('กำลังเปิดโฟลเดอร์…', pickFolder));
    on('btnReopen', () => withBusy('กำลังเปิดโฟลเดอร์…', reopenFolder));
    idb.get('dir').then(h => { const b = document.getElementById('btnReopen'); if (b && h) { b.classList.remove('hidden'); b.textContent = 'เปิดโฟลเดอร์เดิม: ' + h.name; } });
    on('btnSetup', () => firstSetup().catch(e => { S.msg = { cls: 'bad', html: esc(e.message) }; render(); }));
    on('btnFinishSetup', finishSetup);
    on('btnCancelSetup', () => { S.setupDraft = null; render(); });
    on('btnSettings', editSettings); on('btnOff', showOffbook); on('btnOff2', showOffbook); on('btnPending', showPending); on('btnUndo', undoLast);
    on('btnNewCycle', newCycle); on('btnEndDate', changeCycleEnd);
    on('btnClearRej', () => { S.rejected = []; render(); });
    on('btnClearFiles', () => { S.ktb = {}; S.ptm = {}; S.conflicts = {}; S.manual = {}; S.answers = {}; S.rejected = []; render(); });
    on('btnManual', () => manualEntry(S.st.nextDate));
    on('btnManualQ', () => manualEntry(S.st.nextDate));
    on('btnManualCancel', () => { delete S.manual[S.st.nextDate]; render(); });
    on('btnSave', () => saveDay(S.st.nextDate));
    on('btnSaveAll', saveAllReady);
    document.querySelectorAll('button[data-q]').forEach(b => b.onclick = () => answer(S.st.nextDate, b.dataset.q, b.dataset.t));
    const drop = document.getElementById('drop'), fin = document.getElementById('fileIn');
    if (drop && fin) {
      drop.onclick = () => fin.click();
      fin.onchange = () => { const fs = [...fin.files]; fin.value = ''; addFiles(fs); };
      drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
      drop.ondragleave = () => drop.classList.remove('over');
      drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles([...e.dataTransfer.files]); };
    }
    const fb = document.getElementById('fbLedger');
    if (fb) fb.onchange = async () => { const f = fb.files[0]; if (!f) return; await withBusy('กำลังเปิดไฟล์ทะเบียน…', async () => { S.L = await Ledger.load(await f.arrayBuffer()); S.ledgerName = f.name; S.st = Store.readState(S.L); }); };
  }
  // ป้องกันการลากไฟล์ไปเปิดในแท็บ
  window.addEventListener('dragover', e => e.preventDefault()); window.addEventListener('drop', e => e.preventDefault());
  window.FinesApp = { S, render, addFiles, pickFolder, saveDay, saveAllReady, compute, answer, newCycle, finishSetup, undoLast, manualEntry, changeCycleEnd };
  render();
})();
</script>
</body>
</html>
